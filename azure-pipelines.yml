trigger:
- deploy

pool:
  name: 'SHpool'

variables:
  BuildConfiguration: 'Release'
  dockerserviceconnection: 'dockersvcconnection'
  repository: 'vivekns1/blazingpizza'
  imageVersion: '$(Build.SourceVersion)'

stages:

#==========================
# BUILD STAGE
#==========================
- stage: Build
  displayName: Build Application

  jobs:

  - job: BuildJob

    steps:

    - checkout: self

    - task: UseDotNet@2
      displayName: Install .NET SDK
      inputs:
        packageType: sdk
        version: '9.0.x'

    - task: DotNetCoreCLI@2
      displayName: Restore
      inputs:
        command: restore
        projects: 'src/Components/benchmarkapps/BlazingPizza.Server/BlazingPizza.Server.csproj'

    - task: DotNetCoreCLI@2
      displayName: Build
      inputs:
        command: build
        projects: 'src/Components/benchmarkapps/BlazingPizza.Server/BlazingPizza.Server.csproj'
        arguments: '--configuration $(BuildConfiguration)'

    - task: DotNetCoreCLI@2
      displayName: Publish
      inputs:
        command: publish
        publishWebProjects: false
        projects: 'src/Components/benchmarkapps/BlazingPizza.Server/BlazingPizza.Server.csproj'
        arguments: '--configuration $(BuildConfiguration) --output $(Build.ArtifactStagingDirectory)'

    # - task: ArchiveFiles@2
    #   displayName: Create ZIP
    #   inputs:
    #     rootFolderOrFile: '$(Build.ArtifactStagingDirectory)'
    #     includeRootFolder: false
    #     archiveType: zip
    #     archiveFile: '$(Build.ArtifactStagingDirectory)\BlazingPizza.zip'
    #     replaceExistingArchive: true

    # - publish: $(Build.ArtifactStagingDirectory)/BlazingPizza.Server.zip
    #   artifact: drop


#==========================
# DEPLOY STAGE
#==========================


- stage: Createimage
  dependsOn: 'Build'
  jobs:
  - job: BuildAndPush
    steps:
    - task: Docker@2
      displayName: 'Build and Push to Docker Hub'
      inputs:
        containerRegistry: '$(dockerserviceconnection)'
        repository: '$(repository)'
        command: 'buildAndPush'
        Dockerfile: '**/Dockerfile'
        tags: |
          $(imageVersion)

#List target image details in Pipeline logs
    - powershell: |
        $repo = "$(repository)"
        $targetTag = "$(imageVersion)"
        
        Write-Host "Querying Docker Hub API for: $repo"
        Write-Host "Looking for tag: $targetTag"
        Write-Host "--------------------------------"
        
        $apiUrl = "https://docker.com"
        
        try {
            # Make the API call and automatically parse the JSON response
            $response = Invoke-RestMethod -Uri $apiUrl -Method Get
            
            # Extract only the 'name' property from the results list (which matches your tags)
            $tags = $response.results.name
            
            Write-Host "Available Tags Found on Docker Hub:"
            foreach ($tag in $tags) {
                Write-Host " - $tag"
            }
            Write-Host "--------------------------------"
            
            # Verify if the specific version we pushed is visible in the list
            if ($tags -contains $targetTag) {
                Write-Host "SUCCESS: Image tag '$targetTag' was successfully verified on Docker Hub!"
            } else {
                Write-Warning "WARNING: Image tag '$targetTag' was not found in the immediate results list."
                Write-Warning "Please manually double check Docker Hub before proceeding."
            }
        }
        catch {
            Write-Error "Failed to connect or query Docker Hub API: $_"
        }
      displayName: 'Verify Pushed Repository Tags (Windows)'

  - job: Validation
    displayName: 'Manual Validation Approval'
    dependsOn: BuildAndPush
    pool: server
    timeoutInMinutes: 1440 # 24-hour timeout limit before automatically rejecting
    steps:
    - task: ManualValidation@0
      inputs:
        notifyUsers: |
          vivekbhimnath@gmail.com
        instructions: |
          Please review the build logs for job 'BuildAndPush'. 
          Verify that image '$(repository):$(imageVersion)' has been pushed successfully.
        onTimeout: 'reject'