trigger:
- deploy

pool:
  name: 'SHpool'

variables:
  BuildConfiguration: 'Release'
  dockerserviceconnection: 'dockersvcconnection'
  repository: 'vivekns1/blazingpizza'
  imageVersion: '$(Build.SourceVersion)'

stages:

#==========================
# BUILD STAGE
#==========================
- stage: Build
  displayName: Build Application

  jobs:

  - job: BuildJob

    steps:

    - checkout: self

    - task: UseDotNet@2
      displayName: Install .NET SDK
      inputs:
        packageType: sdk
        version: '9.0.x'

    - task: DotNetCoreCLI@2
      displayName: Restore
      inputs:
        command: restore
        projects: 'src/Components/benchmarkapps/BlazingPizza.Server/BlazingPizza.Server.csproj'

    - task: DotNetCoreCLI@2
      displayName: Build
      inputs:
        command: build
        projects: 'src/Components/benchmarkapps/BlazingPizza.Server/BlazingPizza.Server.csproj'
        arguments: '--configuration $(BuildConfiguration)'

    - task: DotNetCoreCLI@2
      displayName: Publish
      inputs:
        command: publish
        publishWebProjects: false
        projects: 'src/Components/benchmarkapps/BlazingPizza.Server/BlazingPizza.Server.csproj'
        arguments: '--configuration $(BuildConfiguration) --output $(Build.ArtifactStagingDirectory)'

    # - task: ArchiveFiles@2
    #   displayName: Create ZIP
    #   inputs:
    #     rootFolderOrFile: '$(Build.ArtifactStagingDirectory)'
    #     includeRootFolder: false
    #     archiveType: zip
    #     archiveFile: '$(Build.ArtifactStagingDirectory)\BlazingPizza.zip'
    #     replaceExistingArchive: true

    # - publish: $(Build.ArtifactStagingDirectory)/BlazingPizza.Server.zip
    #   artifact: drop


#==========================
# DEPLOY STAGE
#==========================


- stage: Createimage
  dependsOn: 'Build'
  jobs:
  - job: BuildAndPush
    steps:
    - task: Docker@2
      displayName: 'Build and Push to Docker Hub'
      inputs:
        containerRegistry: '$(dockerserviceconnection)'
        repository: '$(repository)'
        command: 'buildAndPush'
        Dockerfile: '**/Dockerfile'
        tags: |
          $(imageVersion)

#List target image details in Pipeline logs
    - powershell: |
        $repo = "$(repository)"
        $targetTag = "$(imageVersion)"
        
        Write-Host "Querying Docker Hub API for: $repo"
        Write-Host "Looking for tag: $targetTag"
        Write-Host "--------------------------------"
        
        $apiUrl = "https://docker.com"
        
        # Define a standard browser User-Agent header so Docker Hub doesn't block the request
        $headers = @{
            "User-Agent" = "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"
        }
        
        try {
            # Make the API call with the headers included
            $response = Invoke-RestMethod -Uri $apiUrl -Method Get -Headers $headers
            
            $tags = $response.results.name
            
            if ($null -eq $tags -or $tags.Count -eq 0) {
                Write-Error "ERROR: Received an empty tag list from Docker Hub API. The request might be blocked or throttled."
                exit 1
            }
            
            Write-Host "Available Tags Found on Docker Hub:"
            foreach ($tag in $tags) {
                Write-Host " - $tag"
            }
            Write-Host "--------------------------------"
            
            if ($tags -contains $targetTag) {
                Write-Host "SUCCESS: Image tag '$targetTag' was successfully verified on Docker Hub!"
            } else {
                Write-Error "ERROR: Image tag '$targetTag' was not found in the repository tags list."
                exit 1 # Fails the pipeline step immediately if the tag is missing
            }
        }
        catch {
            Write-Error "Failed to connect or query Docker Hub API: $_"
            exit 1
        }
      displayName: 'Verify Pushed Repository Tags (Windows)'

  - job: Validation
    displayName: 'Manual Validation Approval'
    dependsOn: BuildAndPush
    pool: server
    timeoutInMinutes: 1440 # 24-hour timeout limit before automatically rejecting
    steps:
    - task: ManualValidation@0
      inputs:
        notifyUsers: |
          vivekbhimnath@gmail.com
        instructions: |
          Please review the build logs for job 'BuildAndPush'. 
          Verify that image '$(repository):$(imageVersion)' has been pushed successfully.
        onTimeout: 'reject'