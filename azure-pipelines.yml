trigger:
- k8s-deploy

pool:
  name: 'SHpool'

variables:
  BuildConfiguration: 'Release'
  dockerserviceconnection: 'dockersvcconnection'
  repository: 'vivekns1/blazingpizza'
  imageVersion: '$(Build.SourceVersion)'

stages:

#==========================
# BUILD STAGE
#==========================
- stage: Build
  displayName: Build Application

  jobs:

  - job: BuildJob

    steps:

    - checkout: self

    - task: UseDotNet@2
      displayName: Install .NET SDK
      inputs:
        packageType: sdk
        version: '9.0.x'

    - task: DotNetCoreCLI@2
      displayName: Restore
      inputs:
        command: restore
        projects: 'src/Components/benchmarkapps/BlazingPizza.Server/BlazingPizza.Server.csproj'

    - task: DotNetCoreCLI@2
      displayName: Build
      inputs:
        command: build
        projects: 'src/Components/benchmarkapps/BlazingPizza.Server/BlazingPizza.Server.csproj'
        arguments: '--configuration $(BuildConfiguration)'

    - task: DotNetCoreCLI@2
      displayName: Publish
      inputs:
        command: publish
        publishWebProjects: false
        projects: 'src/Components/benchmarkapps/BlazingPizza.Server/BlazingPizza.Server.csproj'
        arguments: '--configuration $(BuildConfiguration) --output $(Build.ArtifactStagingDirectory)'

    # - task: ArchiveFiles@2
    #   displayName: Create ZIP
    #   inputs:
    #     rootFolderOrFile: '$(Build.ArtifactStagingDirectory)'
    #     includeRootFolder: false
    #     archiveType: zip
    #     archiveFile: '$(Build.ArtifactStagingDirectory)\BlazingPizza.zip'
    #     replaceExistingArchive: true

    # - publish: $(Build.ArtifactStagingDirectory)/BlazingPizza.Server.zip
    #   artifact: drop


#==========================
# DEPLOY STAGE
#==========================


- stage: Createimage
  dependsOn: 'Build'
  jobs:
  - job: BuildAndPush
    steps:
    - task: Docker@2
      displayName: 'Build and Push to Docker Hub'
      inputs:
        containerRegistry: '$(dockerserviceconnection)'
        repository: '$(repository)'
        command: 'buildAndPush'
        Dockerfile: '**/Dockerfile'
        tags: |
          $(imageVersion)

    - powershell: |
        $image = "$(repository):$(imageVersion)"

        Write-Host "=========================="
        Write-Host "Local Images"
        Write-Host "=========================="

        docker images

        Write-Host ""

        Write-Host "=========================="
        Write-Host "Image Size"
        Write-Host "=========================="

        docker image inspect $image --format "{{.Size}} bytes"

        Write-Host ""

        Write-Host "=========================="
        Write-Host "Layer History"
        Write-Host "=========================="

        docker history $image
      displayName: "Analyze Image"

#List target image details in Pipeline logs
    - powershell: |
        $repo = "$(repository)"
        $targetTag = "$(imageVersion)"
        $fullImageUri = "${repo}:${targetTag}"
        
        Write-Host "Verifying Image via native Docker client on Windows Host Machine"
        Write-Host "Target Image to check: $fullImageUri"
        Write-Host "---------------------------------------------------------"
        
        # 1. Clear any local cache of this image tag if it exists 
        # This forces the agent to try and check the real upstream Docker Hub registry
        try {
            Write-Host "Clearing local cache to ensure a fresh remote verification..."
            docker rmi -f $fullImageUri 2>$null
        } catch {
            # Safely ignore if image didn't exist locally yet
        }

        # 2. Use docker manifest inspect to verify the image exists on Docker Hub remotely
        # without needing to download the entire large image payload layers.
        Write-Host "Querying Docker Hub Registry for manifest..."
        docker manifest inspect $fullImageUri > $null 2>&1
        
        # Capture the exit code of the native docker command execution loop
        if ($LastExitCode -eq 0) {
            Write-Host "---------------------------------------------------------"
            Write-Host "SUCCESS: Remote Image tag '$targetTag' was successfully verified on Docker Hub!"
            Write-Host "The image manifest is active, valid, and pullable."
        } else {
            Write-Error "ERROR: Image validation failed. The tag '$targetTag' could not be found or verified on Docker Hub."
            exit 1
        }
      displayName: 'Verify Pushed Repository Tags (Windows CLI)'

  - job: Validation
    displayName: 'Manual Validation Approval'
    dependsOn: BuildAndPush
    pool: server
    timeoutInMinutes: 1440 # 24-hour timeout limit before automatically rejecting
    steps:
    - task: ManualValidation@0
      inputs:
        notifyUsers: |
          vivekbhimnath@gmail.com
        instructions: |
          Please review the build logs for job 'BuildAndPush'. 
          Verify that image '$(repository):$(imageVersion)' has been pushed successfully.
        onTimeout: 'reject'

#==========================
# DEPLOY CONTAINER
#==========================

- stage: ListImagesAndTag
  displayName: 'List Images and Re-Tag Images'
  dependsOn: Createimage
  condition: succeeded()

  jobs:

  - job: ImageVerification

    steps:

    - powershell: |

        $image = "$(repository):$(imageVersion)"
        $container = "blazingpizza"

        Write-Host "Deploying Image: $image"

         # Pull latest image
        docker pull $image

        # Check if container exists
        $exists = docker ps -a --filter "name=^$container$" --format "{{.Names}}"

        if ($exists) {
            Write-Host "Stopping existing container..."
            docker stop $container

            Write-Host "Removing existing container..."
            docker rm $container
        }
        else {
            Write-Host "Container does not exist. Fresh deployment."
        }

        # List images
        docker images



      displayName: 'Pull Image and List Images'

    - powershell: |
        

        (Get-Content manifests/deployments/deploy.yaml) `
         -replace 'IMAGE_TAG','$(imageVersion)' |
         Set-Content manifests/deployments/deploy.yaml

        Get-Content manifests/deployments/deploy.yaml

        docker images
      displayName: Replace Image Tag and List

- stage: DeploytoKube
  displayName: Deploy manifest files to Kubernetes
  dependsOn:  ListImagesAndTag
  condition: succeeded()
    jobs:
    - deployment: deploy
      displayName: Deploy app pods
      environment: Dev
      strategy:
        runOnce:
          deploy:
            steps:
            - task: PowerShell@2
              displayName: Kube pods depl
              inputs:
                targetType: inline
                script: |
                  kubectl apply -f manifests/deployments/deploy.yaml
                  kubectl apply -f manifests/services/service.yaml
                  kubectl rollout status deployment/aspnet-deploy

                  kubectl get deployment
                  kubectl get pods
                  kubectl get svc
                  


                  
            





        

    