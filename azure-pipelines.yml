trigger:
- deploy

pool:
  name: 'SHpool'

variables:
  BuildConfiguration: 'Release'
  dockerserviceconnection: 'dockersvcconnection'
  repository: 'vivekns1/blazingpizza'
  imageVersion: '$(Build.SourceVersion)'

stages:

#==========================
# BUILD STAGE
#==========================
- stage: Build
  displayName: Build Application

  jobs:

  - job: BuildJob

    steps:

    - checkout: self

    - task: UseDotNet@2
      displayName: Install .NET SDK
      inputs:
        packageType: sdk
        version: '9.0.x'

    - task: DotNetCoreCLI@2
      displayName: Restore
      inputs:
        command: restore
        projects: 'src/Components/benchmarkapps/BlazingPizza.Server/BlazingPizza.Server.csproj'

    - task: DotNetCoreCLI@2
      displayName: Build
      inputs:
        command: build
        projects: 'src/Components/benchmarkapps/BlazingPizza.Server/BlazingPizza.Server.csproj'
        arguments: '--configuration $(BuildConfiguration)'

    - task: DotNetCoreCLI@2
      displayName: Publish
      inputs:
        command: publish
        publishWebProjects: false
        projects: 'src/Components/benchmarkapps/BlazingPizza.Server/BlazingPizza.Server.csproj'
        arguments: '--configuration $(BuildConfiguration) --output $(Build.ArtifactStagingDirectory)'

    # - task: ArchiveFiles@2
    #   displayName: Create ZIP
    #   inputs:
    #     rootFolderOrFile: '$(Build.ArtifactStagingDirectory)'
    #     includeRootFolder: false
    #     archiveType: zip
    #     archiveFile: '$(Build.ArtifactStagingDirectory)\BlazingPizza.zip'
    #     replaceExistingArchive: true

    # - publish: $(Build.ArtifactStagingDirectory)/BlazingPizza.Server.zip
    #   artifact: drop


#==========================
# DEPLOY STAGE
#==========================


- stage: Createimage
  dependsOn: 'Build'
  jobs:
  - job: BuildAndPush
    steps:
    - task: Docker@2
      displayName: 'Build and Push to Docker Hub'
      inputs:
        containerRegistry: '$(dockerserviceconnection)'
        repository: '$(repository)'
        command: 'buildAndPush'
        Dockerfile: '**/Dockerfile'
        tags: |
          $(imageVersion)

#List target image details in Pipeline logs
    - script: |
        echo "Verifying image tags for: $(repository)"
        echo "Looking for tag: $(imageVersion)"
        echo "--------------------------------"
        curl -s "https://docker.com" | grep -o '"name": *"[^"]*"' | sed 's/"name": *//' | tr -d '"'
      # Fetches the recent tags from DockerHUB API

  - job: Validation
    displayName: 'Manual Validation Approval'
    dependsOn: BuildAndPush
    timeoutInMinutes: 1440 # 24-hour timeout limit before automatically rejecting
    steps:
    - task: ManualValidation@0
      inputs:
        notifyUsers: |
          vivekbhimnath@gmail.com
        instructions: |
          Please review the build logs for job 'BuildAndPush'. 
          Verify that image '$(repository):$(imageVersion)' has been pushed successfully.
        onTimeout: 'reject'